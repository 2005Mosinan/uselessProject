<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Excuse Generator</title>


<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600&family=Fredoka:wght@500&display=swap" rel="stylesheet">

<style>
    body {
        font-family: 'Baloo 2', cursive;
        background: linear-gradient(135deg, #FFDEE9, #B5FFFC);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        color: #333;
        padding: 20px;
    }

    h1 {
        font-size: 3rem;
        background: linear-gradient(45deg, #FF6F61, #FFB400);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 20px;
        font-weight: bold;
        text-align: center;
        font-family: 'Fredoka', sans-serif;
        text-shadow: 2px 2px #fff5;
    }

    .card {
        background: rgba(255, 255, 255, 0.7);
        padding: 25px;
        border-radius: 20px;
        backdrop-filter: blur(10px);
        box-shadow: 0 8px 32px rgba(0,0,0,0.15);
        max-width: 500px;
        width: 100%;
        text-align: center;
        animation: fadeIn 0.5s ease-in-out;
    }

    #excuse-box {
        font-size: 1.6rem;
        margin: 15px 0;
        min-height: 80px;
        transition: opacity 0.3s ease-in-out;
        color: #444;
        padding: 15px;
        border-radius: 10px;
        background: rgba(255,255,255,0.3);
    }

    select, input {
        padding: 10px;
        font-size: 1rem;
        margin: 5px;
        border-radius: 8px;
        border: none;
        outline: none;
        background: rgba(255,255,255,0.6);
        color: #333;
        font-family: 'Baloo 2', cursive;
    }

    select option {
        color: #333;
    }

    .controls {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        margin: 15px 0;
    }

    .btn {
        padding: 12px 20px;
        font-size: 1rem;
        border: none;
        border-radius: 30px;
        background: linear-gradient(45deg, #FF6F61, #FFB400);
        color: white;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
        font-family: 'Fredoka', sans-serif;
    }

    .btn:hover {
        transform: scale(1.05);
        box-shadow: 0 4px 20px rgba(255,111,97,0.4);
    }

    .btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
    }

    .copy-btn {
        background: linear-gradient(45deg, #36D1DC, #5B86E5);
    }

    .copy-btn:hover {
        box-shadow: 0 4px 20px rgba(91,134,229,0.4);
    }

    .ai-btn {
        background: linear-gradient(45deg, #667eea, #764ba2);
    }

    .ai-btn:hover {
        box-shadow: 0 4px 20px rgba(102,126,234,0.4);
    }

    .add-section, .api-section {
        margin-top: 20px;
        padding: 15px;
        border-radius: 15px;
        background: rgba(255,255,255,0.5);
    }

    .loading {
        display: none;
        color: #666;
        font-style: italic;
    }

    .tone-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 5px;
        margin: 10px 0;
    }

    @keyframes fadeIn {
        from {opacity: 0; transform: translateY(10px);}
        to {opacity: 1; transform: translateY(0);}
    }

    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    .spinner {
        display: inline-block;
        width: 20px;
        height: 20px;
        border: 3px solid #f3f3f3;
        border-top: 3px solid #3498db;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-right: 10px;
    }
</style>
</head>
<body>

<h1>😂 Excuse Generator</h1>

<div class="card">
    <!-- AI Status -->
    <div class="api-section">
        <h3>🤖 AI Powered Excuses</h3>
        <p style="font-size: 0.9rem; color: #555;">✨ AI is ready to generate creative excuses for you!</p>
    </div>

    <!-- Controls -->
    <div class="controls">
        <select id="category">
            <option value="work">Work</option>
            <option value="school">School/Homework</option>
            <option value="gym">Gym</option>
            <option value="wife">Wife</option>
            <option value="girlfriend">Girlfriend</option>
            <option value="husband">Husband</option>
            <option value="boyfriend">Boyfriend</option>
        </select>

        <select id="tone">
            <option value="funny">😂 Funny</option>
            <option value="romantic">💕 Romantic</option>
            <option value="sympathy">😇 Sympathy</option>
            <option value="dramatic">🎭 Dramatic</option>
            <option value="professional">👔 Professional</option>
            <option value="creative">🎨 Creative</option>
            <option value="innocent">😊 Innocent</option>
            <option value="mysterious">🕵️ Mysterious</option>
        </select>
    </div>

    <div id="excuse-box">Choose a category, tone, and click the button...</div>
    <div class="loading" id="loading">
        <span class="spinner"></span>Generating your perfect excuse...
    </div>

    <div class="controls">
        <button class="btn" onclick="generateExcuse()">📝 Random Excuse</button>
        <button class="btn ai-btn" onclick="generateAIExcuse()">🤖 AI Excuse</button>
        <button class="btn copy-btn" onclick="copyExcuse()">📋 Copy</button>
    </div>

    <div class="add-section">
        <h3>Add Your Own Excuse</h3>
        <input type="text" id="new-excuse" placeholder="Type your excuse here" style="width: 80%;">
        <div class="controls">
            <select id="add-category">
                <option value="work">Work</option>
                <option value="school">School/Homework</option>
                <option value="gym">Gym</option>
                <option value="wife">Wife</option>
                <option value="girlfriend">Girlfriend</option>
                <option value="husband">Husband</option>
                <option value="boyfriend">Boyfriend</option>
            </select>
            <button class="btn" onclick="addExcuse()">➕ Add</button>
        </div>
    </div>
</div>

<script>
    const excuses = {
        const excuses = {
    work: [
        "Sorry, I was late because my alarm clock and I are currently going through a toxic breakup.",
        "I got stuck in traffic. Unfortunately, I was the traffic.",
        "My Wi-Fi stopped working, so I had to spend 20 minutes remembering what people looked like.",
        "I was ready to leave, but my cat looked at me like I had disappointed him.",
        "I accidentally replied 'You too' when my boss said 'Have a good day.' I needed time to recover.",
        "I was fighting for my life trying to open a ketchup packet.",
        "Google Maps said I would arrive in 12 minutes. Google Maps lied to me personally.",
        "I couldn't come on time because I was mentally preparing to come on time.",
        "My chair was too comfortable. I became emotionally attached.",
        "I was stuck behind someone walking at exactly 0.5 km/h.",
        "I had an important meeting with my bed. It ran overtime.",
        "My brain installed an update without asking me.",
        "I was productive yesterday, so I needed today to recover.",
        "I accidentally opened Instagram for 'two minutes.' It is now legally tomorrow.",
        "I was busy pretending to work until I actually had to work."
    ],

    school: [
        "My homework wasn't missing. It was simply exploring the world independently.",
        "I finished my homework, but my printer and I have unresolved personal issues.",
        "I was going to study, but my bed started giving motivational speeches.",
        "My pen ran out of ink exactly when my future depended on it.",
        "I forgot my homework at home. Then I forgot why I forgot it.",
        "My brain was present, but unfortunately it was on airplane mode.",
        "I opened the textbook and immediately got a notification from my brain saying 'Try again later.'",
        "I couldn't finish the assignment because my Wi-Fi decided education wasn't necessary.",
        "My dog didn't eat my homework. He just judged it.",
        "I was studying so hard that I accidentally took a three-hour educational nap.",
        "I had an existential crisis halfway through question number two.",
        "I knew the answer, but it was shy and refused to come out.",
        "My calculator needed emotional support.",
        "I was going to submit it yesterday, but yesterday got away from me.",
        "I spent the whole night studying... the ceiling."
    ],

    gym: [
        "I was going to the gym, but my motivation took a different route.",
        "I pulled a muscle reaching for my phone charger.",
        "My body said 'gym,' but my soul said 'biriyani.'",
        "I did one squat and immediately started questioning my life choices.",
        "I couldn't go because my gym clothes were too clean to waste on exercise.",
        "I was resting between sets. Unfortunately, the set was getting farther away.",
        "I accidentally watched a workout reel instead of doing the workout.",
        "My muscles are currently on strike.",
        "I had leg day yesterday. Today is emotional recovery day.",
        "I walked past the gym. That's basically cardio.",
        "I couldn't find my gym shoes. They were hiding from responsibility.",
        "I was mentally lifting weights. You just couldn't see them.",
        "My water bottle was heavy enough. I considered that a workout.",
        "I was going to exercise, but my playlist wasn't emotionally ready.",
        "I joined the gym for the atmosphere. The exercise part was optional."
    ],

    wife: [
        "I was late because I was practicing saying 'Yes, you're right' with confidence.",
        "I didn't forget our anniversary. I was testing whether you remembered.",
        "I was buying you flowers, but then I remembered you might ask why I was buying flowers.",
        "I was preparing my defense before you even asked the question.",
        "My GPS knew where I was going. My survival instincts knew better.",
        "I was trying to remember what I did wrong before you told me.",
        "I spent 45 minutes choosing a restaurant and somehow still chose the wrong one.",
        "I was Googling 'romantic things to do' and accidentally searched 'cheap romantic things.'",
        "I was busy making a list of things I agree with you about.",
        "I couldn't answer immediately because I was calculating the safest possible response.",
        "I was practicing my apology in case this conversation went badly.",
        "I got distracted thinking about how lucky I am. It took longer than expected.",
        "I was hiding because I heard the words 'We need to talk.'",
        "I was trying to remember where I put the thing you asked me to remember.",
        "I was late because I didn't want to arrive before you and risk looking suspicious."
    ],

    girlfriend: [
        "Sorry, I was practicing my 'I definitely wasn't thinking about you' face.",
        "I got distracted looking at your photos. I accidentally started a full documentary.",
        "I was choosing an outfit that would make you say 'You look good.'",
        "I was writing a romantic message, deleted it, rewrote it, deleted it again, and finally sent 'hey.'",
        "I was trying to think of a cute nickname for you and accidentally invented seventeen.",
        "I was busy deciding which picture of you deserves to be my favorite.",
        "I got stuck watching couple videos and started imagining our future. My bad.",
        "I was preparing a surprise, but then I forgot what the surprise was.",
        "I was trying to make you jealous but got jealous myself.",
        "I was practicing flirting with you in my head. It went perfectly there.",
        "I was going to text you first, but then I thought you were going to text me first.",
        "I spent 30 minutes choosing the perfect emoji for my message.",
        "I was thinking about you so hard that I forgot what I was doing.",
        "I was busy being your biggest fan from a safe distance.",
        "I didn't reply because I wanted to seem mysterious. I immediately regretted it."
    ],

    husband: [
        "I was fixing something, but then I realized I had no idea what I was fixing.",
        "The game went into overtime. Then my patience went into overtime.",
        "I was going to do it, but the remote was approximately 14 centimeters too far away.",
        "I was looking for something. I forgot what it was, but I'm still looking.",
        "I was watching a tutorial on how to fix the problem. The tutorial created three new problems.",
        "I was about to help, but the cat sat on me. I legally couldn't move.",
        "I was cleaning the house. Then I found the sofa.",
        "I was trying to save money, so I didn't buy the thing you asked me to buy.",
        "I was thinking about doing the laundry. Thinking is the first step.",
        "I couldn't hear you because I was deeply focused on absolutely nothing.",
        "I was trying to remember what you told me five minutes ago.",
        "I was busy fixing the Wi-Fi. The Wi-Fi was actually fine.",
        "I opened the fridge to think. It worked surprisingly well.",
        "I was going to apologize, but I wanted to understand what I did first.",
        "I wasn't ignoring you. I was buffering."
    ],

    boyfriend: [
        "Sorry, I was trying to find the perfect snack worthy of our relationship.",
        "I was choosing which hoodie you would steal next.",
        "I was practicing what to say when I see you and immediately forget English.",
        "I was watching cute couple videos for completely scientific research.",
        "I was trying to think of a pickup line so bad that you'd laugh and stay.",
        "I got distracted looking at your profile. Again.",
        "I was planning our imaginary vacation with a budget of ₹47.",
        "I was choosing a song for our imaginary movie montage.",
        "I was trying to look cool before meeting you. The plan failed.",
        "I was rehearsing our conversation in my head. You said different things there.",
        "I was going to text you, but I wanted to give you a chance to miss me.",
        "I was searching for the perfect meme to describe my feelings. It doesn't exist yet.",
        "I was busy wondering how you manage to look this good all the time.",
        "I accidentally opened your chat, smiled at my phone, and forgot why I opened it.",
        "I was emotionally unavailable for 12 minutes. I'm back now."
        ]
    };

    function generateExcuse() {
        const category = document.getElementById("category").value;
        const list = excuses[category];
        const randomIndex = Math.floor(Math.random() * list.length);
        const box = document.getElementById("excuse-box");
        box.style.opacity = 0;
        setTimeout(() => {
            box.textContent = list[randomIndex];
            box.style.opacity = 1;
        }, 300);
    }

    async function generateAIExcuse() {
        // TODO: Replace with your actual Gemini API key
        const apiKey = "AQ.Ab8RN6Jsgg0rCcfg5wn_Cpup6_GQBKi2cwnt35-4WlsuIg0_ag";
        
        // if (apiKey === "AQ.Ab8RN6Jsgg0rCcfg5wn_Cpup6_GQBKi2cwnt35-4WlsuIg0_ag") 
        {
        //     alert("Please add your Gemini API key to the code first!");
        //     return;
        // 
        }

        const category = document.getElementById("category").value;
        const tone = document.getElementById("tone").value;
        const box = document.getElementById("excuse-box");
        const loading = document.getElementById("loading");

        // Show loading state
        box.style.opacity = 0.3;
        loading.style.display = "block";
        document.querySelector(".ai-btn").disabled = true;

        const toneDescriptions = {
            funny: "hilarious and absurd",
            romantic: "sweet, loving and romantic",
            sympathy: "sympathetic and understanding",
            dramatic: "overly dramatic and theatrical",
            professional: "formal and business-appropriate",
            creative: "creative and imaginative",
            innocent: "innocent and childlike",
            mysterious: "mysterious and intriguing"
        };

        const prompt = `Generate a ${toneDescriptions[tone]} excuse for ${category}. 
        The excuse should be:
        - One or two sentences maximum
        - ${tone} in tone
        - Believable but creative
        - Appropriate for the context of ${category}
        
        Just return the excuse text, nothing else.`;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-goog-api-key': apiKey
                },
                body: JSON.stringify({
                    contents: [{
                        parts: [{
                            text: prompt
                        }]
                    }]
                })
            });

            if (!response.ok) {
                throw new Error(`API Error: ${response.status}`);
            }

            const data = await response.json();
            const generatedExcuse = data.candidates[0].content.parts[0].text.trim();
            
            // Add to our collection for future random selections
            excuses[category].push(generatedExcuse);
            
            setTimeout(() => {
                box.textContent = generatedExcuse;
                box.style.opacity = 1;
                loading.style.display = "none";
                document.querySelector(".ai-btn").disabled = false;
            }, 300);

        } catch (error) {
            console.error('Error generating excuse:', error);
            loading.style.display = "none";
            box.style.opacity = 1;
            document.querySelector(".ai-btn").disabled = false;
            alert('Failed to generate AI excuse. Please check your API key and try again.');
        }
    }

    function copyExcuse() {
        const excuseText = document.getElementById("excuse-box").textContent;
        if (excuseText && excuseText !== "Choose a category, tone, and click the button...") {
            navigator.clipboard.writeText(excuseText).then(() => {
                alert("Excuse copied to clipboard! 📋");
            }).catch(() => {
                // Fallback for older browsers
                const textArea = document.createElement("textarea");
                textArea.value = excuseText;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                alert("Excuse copied to clipboard! 📋");
            });
        } else {
            alert("Generate an excuse first! 😊");
        }
    }

    function addExcuse() {
        const newExcuse = document.getElementById("new-excuse").value.trim();
        const category = document.getElementById("add-category").value;

        if (newExcuse) {
            excuses[category].push(newExcuse);
            document.getElementById("new-excuse").value = "";
            alert("Your excuse has been added! 🎉");
        } else {
            alert("Please type an excuse before adding. ✍️");
        }
    }

    // API key is now hardcoded in the generateAIExcuse function
    // No need for input field event listener
</script>

</body>
</html>
